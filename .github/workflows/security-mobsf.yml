name: Security - Signed APK MobSF (Manual)

on:
  workflow_dispatch:
    inputs:
      include_finding_titles:
        description: "Show sanitized rule titles in the public job summary (no code, paths or descriptions)."
        type: boolean
        default: false
      include_detailed_report:
        description: "Upload raw findings? WARNING: artifacts of this public repo may be downloaded by others."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout safe local report formatter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the existing signed rolling APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="$RUNNER_TEMP/pesatrack-security-apk"
          mkdir -p "$apk_dir"
          gh release download ci-apk --repo "$GITHUB_REPOSITORY" \
            --pattern 'PesaTrack-Full.apk' --dir "$apk_dir"
          apk="$apk_dir/PesaTrack-Full.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          sha256sum "$apk" >> "$GITHUB_STEP_SUMMARY"
          echo "PESATRACK_SCAN_APK=$apk" >> "$GITHUB_ENV"

      - name: Run isolated MobSF static analysis
        shell: bash
        run: |
          set -euo pipefail
          api_key="$(openssl rand -hex 32)"
          echo "::add-mask::$api_key"
          docker run --detach --rm --name pesatrack-mobsf \
            --publish 127.0.0.1:8000:8000 \
            --env "MOBSF_API_KEY=$api_key" \
            --env MOBSF_API_ONLY=1 \
            opensecurity/mobile-security-framework-mobsf@sha256:4e895e4e20223de61e07dd52abcf728cbee932470c64bc5aea4c701ed9ed825b
          trap 'docker stop pesatrack-mobsf >/dev/null 2>&1 || true' EXIT

          base='http://127.0.0.1:8000'
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 2 \
              --header "Authorization: $api_key" "$base/api/v1/scans" >/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          if [[ "$ready" != 1 ]]; then
            echo 'MobSF did not become ready in five minutes.' >&2
            exit 1
          fi

          upload="$(curl --silent --show-error --fail-with-body --request POST \
            --header "Authorization: $api_key" \
            --form "file=@${PESATRACK_SCAN_APK}" "$base/api/v1/upload")"
          hash="$(jq -er '.hash // empty' <<< "$upload")"
          scan="$(curl --silent --show-error --fail-with-body --request POST \
            --header "Authorization: $api_key" \
            --data-urlencode "hash=$hash" "$base/api/v1/scan")"
          jq -e '.error? == null' <<< "$scan" >/dev/null

          curl --silent --show-error --fail-with-body --request POST \
            --header "Authorization: $api_key" \
            --data-urlencode "hash=$hash" "$base/api/v1/report_json" \
            --output "$RUNNER_TEMP/pesatrack-mobsf-report.json"
          report="$RUNNER_TEMP/pesatrack-mobsf-report.json"
          jq -e '(.appsec.security_score | type == "number") and
            (.appsec.high | type == "array") and
            (.appsec.warning | type == "array") and
            (.appsec.hotspot | type == "array")' "$report" >/dev/null
          if [[ '${{ inputs.include_finding_titles }}' == 'true' ]]; then
            bash tools/mobsf-safe-summary.sh --titles < "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            bash tools/mobsf-safe-summary.sh < "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain security report briefly for manual review
        if: ${{ success() && inputs.include_detailed_report }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pesatrack-mobsf-static-report
          path: ${{ runner.temp }}/pesatrack-mobsf-report.json
          if-no-files-found: error
          retention-days: 3
