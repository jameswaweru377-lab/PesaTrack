name: UI audit emulator review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: ui-audit-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  instrumentation:
    if: ${{ github.head_ref == 'fix/ui-audit-remaining-20261010' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "wrapper"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.kedevjimmy.pesatrack.ui.screens.PrivacyReminderSettingsUiTest,com.kedevjimmy.pesatrack.ingestion.NotificationSourceApprovalUiTest,com.kedevjimmy.pesatrack.ui.OwnershipReviewUiTest,com.kedevjimmy.pesatrack.data.local.OwnershipReviewEvidenceTest,com.kedevjimmy.pesatrack.ui.FinancialReadFailureUiTest,com.kedevjimmy.pesatrack.ui.AuditAccessibilityUiTest,com.kedevjimmy.pesatrack.ui.screens.PlanCacheUiTest,com.kedevjimmy.pesatrack.ui.SmartRuleConsentUiTest --stacktrace
            adb logcat -d -v raw 'PesaTrackMeasurement:I' '*:S' > history-measurements.jsonl
            echo "${{ github.sha }}" > ANDROID_TEST_SOURCE_SHA.txt

      - name: Retain invented Android test and timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-audit-emulator-evidence
          retention-days: 14
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            history-measurements.jsonl
            ANDROID_TEST_SOURCE_SHA.txt

