name: Deploy Entity Enrichment Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/entity-enrichment/**"
      - "wrangler.jsonc"
      - ".github/workflows/entity-enrichment-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: pesatrack
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing repository secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "Missing repository secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Validate Worker source
        run: |
          node --check worker/entity-enrichment/src/index.js
          node worker/entity-enrichment/test.mjs

      - name: Deploy Worker
        working-directory: worker/entity-enrichment
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Discover deployed Worker URL
        id: worker_url
        shell: bash
        run: |
          set -euo pipefail

          response="$(
            curl --fail --silent --show-error               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               -H "Content-Type: application/json"               "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          )"

          subdomain="$(
            node -e '
              const payload = JSON.parse(process.argv[1]);
              if (
                payload.success !== true ||
                !payload.result ||
                typeof payload.result.subdomain !== "string" ||
                !payload.result.subdomain.trim()
              ) {
                process.exit(1);
              }
              process.stdout.write(
                payload.result.subdomain.trim()
              );
            ' "${response}"
          )"

          base="https://${WORKER_NAME}.${subdomain}.workers.dev"
          echo "base_url=${base}" >> "${GITHUB_OUTPUT}"
          echo "resolve_url=${base}/v1/entity/resolve" >> "${GITHUB_OUTPUT}"

      - name: Verify deployed Worker and provider
        env:
          WORKER_BASE_URL: ${{ steps.worker_url.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail

          response="$(
            curl --fail --silent --show-error               "${WORKER_BASE_URL}/v1/entity/health"
          )"
          echo "${response}"

          node -e '
            const payload = JSON.parse(process.argv[1]);
            if (
              payload.status !== "ok" ||
              payload.privacyMode !==
                "sanitized-descriptor-only"
            ) {
              console.error(
                "Worker health/privacy contract failed."
              );
              process.exit(1);
            }
            if (payload.providerConfigured !== true) {
              console.error(
                "Worker is deployed but LOGO_DEV_SECRET_KEY is not configured in Cloudflare."
              );
              process.exit(2);
            }
          ' "${response}"

      - name: Configure Android enrichment endpoint
        env:
          RESOLVE_URL: ${{ steps.worker_url.outputs.resolve_url }}
        shell: bash
        run: |
          set -euo pipefail

          gh variable set             PESATRACK_ENTITY_ENRICHMENT_URL             --body "${RESOLVE_URL}"             --repo "${GITHUB_REPOSITORY}"

          {
            echo "### Entity enrichment activated"
            echo
            echo "Worker deployment and provider readiness checks passed."
            echo
            echo "Android endpoint:"
            echo
            echo "\`${RESOLVE_URL}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Rebuild rolling APK with Worker endpoint
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run             android-ci.yml             --ref main             --repo "${GITHUB_REPOSITORY}"
