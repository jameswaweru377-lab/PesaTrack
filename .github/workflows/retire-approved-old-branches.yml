name: Owner-approved old branch retirement

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merged-branch-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preview:
    name: Preview exactly 42 approved old branches
    if: >-
      github.event.issue.number == 528 &&
      github.actor == 'jameswaweru377-lab' &&
      github.event.comment.user.login == 'jameswaweru377-lab' &&
      github.event.comment.body == '/pesatrack-retire-old-42'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Preview pinned branches, open PR exclusions and protected refs
        run: |
          set -euo pipefail
          python3 -m tools.tracker.old_branch_retirement \
            --repository "$GITHUB_REPOSITORY" \
            --manifest tools/tracker/approved_old_branch_retirement_20261101.json \
            | tee "$RUNNER_TEMP/old-branch-preview.json"

  apply:
    name: Archive each tip before exact-lease branch deletion
    needs: preview
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event.issue.number == 528 &&
      github.actor == 'jameswaweru377-lab' &&
      github.event.comment.user.login == 'jameswaweru377-lab' &&
      github.event.comment.body == '/pesatrack-retire-old-42'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Archive old commit SHAs then delete exactly matching branches
        run: |
          set -euo pipefail
          python3 -m tools.tracker.old_branch_retirement \
            --repository "$GITHUB_REPOSITORY" \
            --manifest tools/tracker/approved_old_branch_retirement_20261101.json \
            --apply | tee "$RUNNER_TEMP/old-branch-apply.json"
      - name: Report archived, deleted and safely skipped branches
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/old-branch-apply.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path
          source = Path(sys.argv[1])
          if not source.exists():
              raise SystemExit("No apply report was produced")
          report = json.loads(source.read_text(encoding="utf-8"))
          lines = ["# Owner-approved old branch retirement", "",
                   f"Approved: **{report['approved_count']}**; deleted: **{len(report['deleted'])}**; "
                   f"skipped: **{len(report['skipped'])}**; failures: **{len(report['failures'])}**", "",
                   "Every deleted branch was archived to a recovery tag at its exact previous SHA.", ""]
          for item in report['deleted']:
              lines.append(f"- Deleted `{item['branch']}` at `{item['sha']}`; archive tag `{item['archive_ref']}`")
          for item in report['skipped']:
              lines.append(f"- Retained `{item['branch']}`: {item['reason']}")
          for item in report['failures']:
              lines.append(f"- STOPPED on `{item['branch']}`: {item['reason']}")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write("\n".join(lines) + "\n")
          PY
