name: Owner-approved retirement of two superseded docs proposals

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: merged-branch-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.event.issue.number == 528 &&
      github.actor == 'jameswaweru377-lab' &&
      github.event.comment.user.login == 'jameswaweru377-lab' &&
      github.event.comment.body == '/pesatrack-retire-two-superseded-docs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - run: python3 -m tools.tracker.retire_superseded_docs

  apply:
    needs: preview
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event.issue.number == 528 &&
      github.actor == 'jameswaweru377-lab' &&
      github.event.comment.user.login == 'jameswaweru377-lab' &&
      github.event.comment.body == '/pesatrack-retire-two-superseded-docs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - run: python3 -m tools.tracker.retire_superseded_docs --apply
