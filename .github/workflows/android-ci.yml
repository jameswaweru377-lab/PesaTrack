name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Validate entity enrichment Worker
        run: |
          node --check worker/entity-enrichment/src/index.js
          node worker/entity-enrichment/test.mjs
          npx --yes wrangler@4 deploy --config wrangler.jsonc --dry-run --outdir /tmp/pesatrack-worker-dry-run

      - name: Unit tests, lint and debug APK
        env:
          PESATRACK_ENTITY_ENRICHMENT_URL: https://pesatrack.jameswaweru399.workers.dev/v1/entity/resolve
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace 2>&1 | tee /tmp/pesatrack-build.log

      - name: Comment build failure diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '<!-- pesatrack-ci-diagnostic -->'
            echo '### Android CI build failure'
            echo
            echo 'Latest failure excerpt from the PR build:'
            echo
            echo '\`\`\`text'
            tail -n 160 /tmp/pesatrack-build.log 2>/dev/null || echo 'Build log was not created.'
            echo '\`\`\`'
          } > /tmp/pesatrack-ci-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/pesatrack-ci-comment.md

      - name: Print lint report on failure
        if: failure()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            cat "$report"
          fi

      - name: Publish rolling debug APK
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          apk="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$apk" ]]; then
            echo "Expected APK not found at $apk"
            exit 1
          fi

          if ! gh release view ci-apk >/dev/null 2>&1; then
            gh release create ci-apk \
              --target "$GITHUB_SHA" \
              --title "PesaTrack Rolling CI APK" \
              --notes "Rolling prerelease containing the latest successful PesaTrack debug APK from main. The attached PesaTrack-debug.apk is authoritative; the release source archive remains tied to the original ci-apk tag." \
              --prerelease
          fi

          cp "$apk" PesaTrack-debug.apk

          # Remove the first workaround asset if it exists under the Gradle filename.
          gh release delete-asset ci-apk app-debug.apk --yes >/dev/null 2>&1 || true

          gh release upload ci-apk \
            PesaTrack-debug.apk \
            --clobber


  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace
