name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Validate entity enrichment Worker
        run: |
          node --check worker/entity-enrichment/src/index.js
          node worker/entity-enrichment/test.mjs
          npx --yes wrangler@4 deploy --config wrangler.jsonc --dry-run --outdir /tmp/pesatrack-worker-dry-run

      - name: Unit tests, lint and debug APK
        env:
          PESATRACK_ENTITY_ENRICHMENT_URL: https://pesatrack.jameswaweru399.workers.dev/v1/entity/resolve
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Print lint report on failure
        if: failure()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            cat "$report"
          fi

      - name: Publish rolling debug APK
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          apk="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$apk" ]]; then
            echo "Expected APK not found at $apk"
            exit 1
          fi

          if ! gh release view ci-apk >/dev/null 2>&1; then
            gh release create ci-apk \
              --target "$GITHUB_SHA" \
              --title "PesaTrack Rolling CI APK" \
              --notes "Rolling prerelease containing the latest successful PesaTrack debug APK from main. The attached PesaTrack-debug.apk is authoritative; the release source archive remains tied to the original ci-apk tag." \
              --prerelease
          fi

          cp "$apk" PesaTrack-debug.apk

          # Remove the first workaround asset if it exists under the Gradle filename.
          gh release delete-asset ci-apk app-debug.apk --yes >/dev/null 2>&1 || true

          gh release upload ci-apk \
            PesaTrack-debug.apk \
            --clobber


  database-migration-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install emulator and Android image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager             "platform-tools"             "emulator"             "platforms;android-36"             "build-tools;36.0.0"             "system-images;android-35;google_apis;x86_64"

      - name: Create migration-test emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd             --force             --name pesatrack-migration-ci             --package "system-images;android-35;google_apis;x86_64"             --device "pixel_2"

      - name: Start emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm || true
          nohup emulator             -avd pesatrack-migration-ci             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -gpu swiftshader_indirect             > /tmp/pesatrack-emulator.log 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/pesatrack-emulator.log
          exit 1

      - name: Run database migration instrumentation tests
        env:
          PESATRACK_ENTITY_ENRICHMENT_URL: https://pesatrack.jameswaweru399.workers.dev/v1/entity/resolve
        run: |
          gradle :app:connectedDebugAndroidTest             -Pandroid.testInstrumentationRunnerArguments.class=com.kedevjimmy.pesatrack.data.local.PesaTrackDatabaseMigrationTest             --stacktrace

      - name: Print emulator log on failure
        if: failure()
        run: cat /tmp/pesatrack-emulator.log || true
