name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Validate entity enrichment Worker
        run: |
          node --check worker/entity-enrichment/src/index.js
          node worker/entity-enrichment/test.mjs

      - name: Unit tests and debug APK
        env:
          PESATRACK_ENTITY_ENRICHMENT_URL: ${{ vars.PESATRACK_ENTITY_ENRICHMENT_URL }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Publish rolling debug APK
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          apk="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$apk" ]]; then
            echo "Expected APK not found at $apk"
            exit 1
          fi

          if ! gh release view ci-apk >/dev/null 2>&1; then
            gh release create ci-apk \
              --target "$GITHUB_SHA" \
              --title "PesaTrack Rolling CI APK" \
              --notes "Rolling prerelease containing the latest successful PesaTrack debug APK from main. The attached PesaTrack-debug.apk is authoritative; the release source archive remains tied to the original ci-apk tag." \
              --prerelease
          fi

          cp "$apk" PesaTrack-debug.apk

          # Remove the first workaround asset if it exists under the Gradle filename.
          gh release delete-asset ci-apk app-debug.apk --yes >/dev/null 2>&1 || true

          gh release upload ci-apk \
            PesaTrack-debug.apk \
            --clobber
