name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.5.0"

      - name: Validate entity enrichment Worker
        run: |
          node --check worker/entity-enrichment/src/index.js
          node worker/entity-enrichment/test.mjs
          npx --yes wrangler@4.148.0 deploy --config wrangler.jsonc --dry-run --outdir /tmp/pesatrack-worker-dry-run

      - name: Generate invented financial message variants
        run: |
          python3 -m tools.python_lab.synthetic_corpus
          python3 -m tools.python_lab.financial_contracts generate

      - name: Unit tests, lint and debug APK
        env:
          PESATRACK_SYNTHETIC_CORPUS_REQUIRED: "1"
          PESATRACK_ENTITY_ENRICHMENT_URL: https://pesatrack.jameswaweru399.workers.dev/v1/entity/resolve
        shell: bash
        run: |
          set -o pipefail
          export PESATRACK_LAB_SOURCE_SHA="$(git rev-parse HEAD)"
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace 2>&1 | tee /tmp/pesatrack-build.log

      - name: Summarize Kotlin regression evidence
        shell: bash
        run: |
          export PESATRACK_LAB_SOURCE_SHA="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          reports = list(pathlib.Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          assert reports, "JVM test reports are required"
          suites = [ET.parse(path).getroot() for path in reports]
          totals = {key: sum(int(suite.attrib.get(key, 0)) for suite in suites) for key in ("tests", "failures", "errors", "skipped")}
          assert totals["failures"] == totals["errors"] == 0
          required = {"OfflineMoneyPolicyTest", "GoalSavingHistoryPolicyTest", "FinancialWhitespaceTest", "SyntheticFinancialCorpusTest", "FinancialContractLabTest"}
          verified = set()
          for suite in suites:
              name = suite.attrib["name"].split(".")[-1]
              if name in required:
                  assert int(suite.attrib["tests"]) > 0 and int(suite.attrib.get("skipped", 0)) == 0, name
                  verified.add(name)
          assert verified == required, "All new Kotlin contracts must execute"
          evidence = {"source_sha": os.environ["PESATRACK_LAB_SOURCE_SHA"], "jvm": totals, "required_suites": sorted(verified), "synthetic_variants": 2432}
          pathlib.Path("app/build/python-lab/unit-evidence.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, indent=2))
          PY

      - name: Print lint report on failure
        if: failure()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            cat "$report"
          fi

      - name: Python lab contract tests
        run: python3 -m unittest discover -s tools/python_lab -p 'test_*.py' -v

      - name: Evaluate reviewed fixtures against actual Kotlin outputs
        env:
          PESATRACK_ENTITY_ENRICHMENT_URL: https://pesatrack.jameswaweru399.workers.dev/v1/entity/resolve
        shell: bash
        run: |
          set -euo pipefail
          export PESATRACK_LAB_SOURCE_SHA="$(git rev-parse HEAD)"
          export PESATRACK_PYTHON_LAB_EXPORT=1
          rm -f app/build/python-lab/kotlin-output.json
          gradle :app:testDebugUnitTest --tests '*PythonFinancialLabExportTest' --rerun-tasks --stacktrace
          python3 -m tools.python_lab.kotlin_evaluation > app/build/python-lab/evaluation.json
          cat app/build/python-lab/evaluation.json

      - name: Evaluate four invented financial contract groups
        if: success() || failure()
        shell: bash
        run: |
          export PESATRACK_LAB_SOURCE_SHA="$(git rev-parse HEAD)"
          if [ -f app/build/python-lab/financial-contract-output.json ]; then
            python3 -m tools.python_lab.financial_contracts evaluate
          else
            echo "Kotlin contract output unavailable; preceding build did not complete the contract suite."
            exit 1
          fi

      - name: Upload sanitized Python lab evaluation evidence
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-kotlin-sanitized-evaluation
          path: app/build/python-lab/*.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload debug APK for gated publication
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pesatrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3


  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.5.0"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

  publish:
    needs: [build, instrumentation]
    if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download tested debug APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pesatrack-debug-apk
          path: dist

      - name: Publish rolling debug APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          apk="dist/app-debug.apk"

          if [[ ! -f "$apk" ]]; then
            echo "Expected tested APK not found at $apk"
            exit 1
          fi

          if ! gh release view ci-apk >/dev/null 2>&1; then
            gh release create ci-apk \
              --target "$GITHUB_SHA" \
              --title "PesaTrack Rolling CI APK" \
              --notes "Rolling prerelease containing the latest PesaTrack debug APK from main that passed build, lint, unit tests and Android instrumentation. The attached PesaTrack-debug.apk is authoritative; the release source archive remains tied to the original ci-apk tag." \
              --prerelease
          fi

          cp "$apk" PesaTrack-debug.apk

          gh release delete-asset ci-apk app-debug.apk --yes >/dev/null 2>&1 || true

          gh release upload ci-apk \
            PesaTrack-debug.apk \
            --clobber

