name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Cleanup completed workflow runs older than 3 days
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff_epoch="$(date -u -d '3 days ago' +%s)"
          repo="$GITHUB_REPOSITORY"
          tmp="$(mktemp)"
          gh api --paginate "repos/$repo/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .created_at, .status] | @tsv' > "$tmp"
          deleted=0
          while IFS=$'\t' read -r run_id created_at status; do
            created_epoch="$(date -u -d "$created_at" +%s)"
            if [[ "$status" == "completed" && "$created_epoch" -lt "$cutoff_epoch" ]]; then
              echo "Deleting run $run_id created $created_at"
              gh api --method DELETE "repos/$repo/actions/runs/$run_id"
              deleted=$((deleted + 1))
            fi
          done < "$tmp"
          echo "Deleted $deleted old completed workflow runs."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Unit tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pesatrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
