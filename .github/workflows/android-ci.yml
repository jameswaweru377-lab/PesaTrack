name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      run_instrumentation:
        description: "Run emulator tests for an explicit review (optional for preview APK publication)"
        type: boolean
        default: false

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.run_instrumentation && 'review' || 'build' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check security invariants before compiling
        run: python3 tools/security_scan.py

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.13 for embedded offline PDF extraction
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Test Command Center tracker safeguards
        run: |
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
          python3 -B -m unittest discover -s tools/tracker/tests -q

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "wrapper"

      - name: Validate entity enrichment Worker
        run: |
          node --check worker/entity-enrichment/src/index.js
          node worker/entity-enrichment/test.mjs
          node worker/entity-enrichment/resource-test.mjs
          npx --yes wrangler@4.148.0 deploy --config wrangler.jsonc --dry-run --outdir /tmp/pesatrack-worker-dry-run

      - name: Generate invented financial message variants
        run: |
          python3 -m tools.python_lab.synthetic_corpus
          python3 -m tools.python_lab.financial_contracts generate

      - name: Unit tests, lint and debug APK
        env:
          PESATRACK_SYNTHETIC_CORPUS_REQUIRED: "1"
          PESATRACK_ENTITY_ENRICHMENT_URL: https://pesatrack.jameswaweru399.workers.dev/v1/entity/resolve
        shell: bash
        run: |
          set -o pipefail
          export PESATRACK_LAB_SOURCE_SHA="$(git rev-parse HEAD)"
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:compileDebugAndroidTestKotlin --stacktrace 2>&1 | tee /tmp/pesatrack-build.log

      - name: Verify debug APK integrity and Android package metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          test -s "$apk"
          echo "APK size: $(stat -c '%s bytes' "$apk")"
          sha256sum "$apk"
          unzip -t "$apk"
          "$tools/zipalign" -c -v 4 "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" | tee /tmp/pesatrack-apk-badging.txt
          grep -F "package: name='com.kedevjimmy.pesatrack'" /tmp/pesatrack-apk-badging.txt
          grep -F "sdkVersion:'24'" /tmp/pesatrack-apk-badging.txt
          grep -F "targetSdkVersion:'36'" /tmp/pesatrack-apk-badging.txt
          grep -F "native-code: 'arm64-v8a'" /tmp/pesatrack-apk-badging.txt
          echo "APK archive, alignment, signature, package ID, SDK bounds, and ABI checks passed."

      - name: Test rolling signed APK publication safeguards
        run: python3 -m unittest tools.test_publish_rolling_apks -v

      - name: Summarize Kotlin regression evidence
        shell: bash
        run: |
          export PESATRACK_LAB_SOURCE_SHA="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          reports = list(pathlib.Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          assert reports, "JVM test reports are required"
          suites = [ET.parse(path).getroot() for path in reports]
          totals = {key: sum(int(suite.attrib.get(key, 0)) for suite in suites) for key in ("tests", "failures", "errors", "skipped")}
          assert totals["failures"] == totals["errors"] == 0
          required = {"OfflineMoneyPolicyTest", "GoalSavingHistoryPolicyTest", "FinancialWhitespaceTest", "SyntheticFinancialCorpusTest", "FinancialContractLabTest", "OwnedTransferReviewPolicyTest", "SelfNameEvidencePolicyTest"}
          verified = set()
          for suite in suites:
              name = suite.attrib["name"].split(".")[-1]
              if name in required:
                  assert int(suite.attrib["tests"]) > 0 and int(suite.attrib.get("skipped", 0)) == 0, name
                  verified.add(name)
          assert verified == required, "All new Kotlin contracts must execute"
          evidence = {"source_sha": os.environ["PESATRACK_LAB_SOURCE_SHA"], "jvm": totals, "required_suites": sorted(verified), "synthetic_variants": 2432}
          pathlib.Path("app/build/python-lab/unit-evidence.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, indent=2))
          PY

      - name: Print lint report on failure
        if: failure()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            cat "$report"
          fi

      - name: Test offline pdfplumber against invented physical-grid PDFs
        run: |
          python3 -m pip install --disable-pip-version-check "pdfplumber==0.11.9" "reportlab==4.4.9"
          PYTHONPATH="$PWD/app/src/main/python:$PWD" python3 -m unittest discover -s tools/python_lab -p 'test_mpesa_pdfplumber_android.py' -v

      - name: Python lab contract tests
        run: PYTHONPATH="$PWD/app/src/main/python:$PWD" python3 -m unittest discover -s tools/python_lab -p 'test_*.py' -v

      - name: Evaluate reviewed fixtures against actual Kotlin outputs
        env:
          PESATRACK_ENTITY_ENRICHMENT_URL: https://pesatrack.jameswaweru399.workers.dev/v1/entity/resolve
        shell: bash
        run: |
          set -euo pipefail
          export PESATRACK_LAB_SOURCE_SHA="$(git rev-parse HEAD)"
          export PESATRACK_PYTHON_LAB_EXPORT=1
          rm -f app/build/python-lab/kotlin-output.json
          ./gradlew :app:testDebugUnitTest --tests '*PythonFinancialLabExportTest' --tests '*FinancialContractLabTest' --rerun-tasks --stacktrace
          python3 -m tools.python_lab.kotlin_evaluation > app/build/python-lab/evaluation.json
          cat app/build/python-lab/evaluation.json

      - name: Evaluate four invented financial contract groups
        if: success() || failure()
        shell: bash
        run: |
          export PESATRACK_LAB_SOURCE_SHA="$(git rev-parse HEAD)"
          if [ -f app/build/python-lab/financial-contract-output.json ]; then
            python3 -m tools.python_lab.financial_contracts evaluate
          else
            echo "Kotlin contract output unavailable; preceding build did not complete the contract suite."
            exit 1
          fi

      - name: Upload sanitized Python lab evaluation evidence
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-kotlin-sanitized-evaluation
          path: app/build/python-lab/*.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload debug APK for gated publication
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pesatrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3


  # Emulator review is paused and stays opt-in through a new manual request.
  instrumentation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_instrumentation }}
    runs-on: ubuntu-latest
    # Full suite includes 3x 30/90-day per-record history replay measurements.
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "wrapper"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            adb logcat -d -v raw 'PesaTrackMeasurement:I' '*:S' > history-measurements.jsonl
            echo "${{ github.sha }}" > ANDROID_TEST_SOURCE_SHA.txt

      - name: Retain invented Android test and timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-ci-results
          retention-days: 14
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            history-measurements.jsonl
            ANDROID_TEST_SOURCE_SHA.txt

  publish:
    needs: [build]
    if: needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Checkout the commit that passed validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.13 for embedded offline PDF extraction
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "wrapper"

      - name: Require the existing protected release-signing credentials
        env:
          PESATRACK_RELEASE_KEYSTORE_BASE64: ${{ secrets.PESATRACK_RELEASE_KEYSTORE_BASE64 }}
          PESATRACK_RELEASE_STORE_PASSWORD: ${{ secrets.PESATRACK_RELEASE_STORE_PASSWORD }}
          PESATRACK_RELEASE_KEY_ALIAS: ${{ secrets.PESATRACK_RELEASE_KEY_ALIAS }}
          PESATRACK_RELEASE_KEY_PASSWORD: ${{ secrets.PESATRACK_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for secret in PESATRACK_RELEASE_KEYSTORE_BASE64 PESATRACK_RELEASE_STORE_PASSWORD PESATRACK_RELEASE_KEY_ALIAS PESATRACK_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "Missing required signing secret: $secret. Rolling APK publication is blocked; no debug fallback."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/pesatrack-release.jks"
          printf '%s' "$PESATRACK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          echo "PESATRACK_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          # CI workflow run numbers increase across accepted main runs; filenames stay fixed.
          echo "PESATRACK_VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "PESATRACK_VERSION_NAME=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Assemble the signed update from the tested commit
        env:
          PESATRACK_RELEASE_STORE_PASSWORD: ${{ secrets.PESATRACK_RELEASE_STORE_PASSWORD }}
          PESATRACK_RELEASE_KEY_ALIAS: ${{ secrets.PESATRACK_RELEASE_KEY_ALIAS }}
          PESATRACK_RELEASE_KEY_PASSWORD: ${{ secrets.PESATRACK_RELEASE_KEY_PASSWORD }}
          PESATRACK_ENTITY_ENRICHMENT_URL: https://pesatrack.jameswaweru399.workers.dev/v1/entity/resolve
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify compatibility and replace only the two rolling APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_PATH: app/build/outputs/apk/release/app-release.apk
        run: bash tools/publish_rolling_apks.sh


  restricted_review_candidate:
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/statement-signing-review-20261101' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c278f57a9bad7690ae7b622c8aa0ad1b1f719d59
      - name: Check candidate identity
        run: test "$(git rev-parse HEAD)" = c278f57a9bad7690ae7b622c8aa0ad1b1f719d59
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: wrapper
      - name: Build the signed test candidate
        env:
          PESATRACK_RELEASE_KEYSTORE_BASE64: ${{ secrets.PESATRACK_RELEASE_KEYSTORE_BASE64 }}
          PESATRACK_RELEASE_STORE_PASSWORD: ${{ secrets.PESATRACK_RELEASE_STORE_PASSWORD }}
          PESATRACK_RELEASE_KEY_ALIAS: ${{ secrets.PESATRACK_RELEASE_KEY_ALIAS }}
          PESATRACK_RELEASE_KEY_PASSWORD: ${{ secrets.PESATRACK_RELEASE_KEY_PASSWORD }}
          PESATRACK_VERSION_CODE: '201950'
          PESATRACK_VERSION_NAME: '0.1.1950-review'
          PESATRACK_ENTITY_ENRICHMENT_URL: https://pesatrack.jameswaweru399.workers.dev/v1/entity/resolve
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/pesatrack-review.jks"
          trap 'rm -f "$keystore"' EXIT
          for secret in PESATRACK_RELEASE_KEYSTORE_BASE64 PESATRACK_RELEASE_STORE_PASSWORD PESATRACK_RELEASE_KEY_ALIAS PESATRACK_RELEASE_KEY_PASSWORD; do
            test -n "${!secret}"
          done
          printf '%s' "$PESATRACK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          export PESATRACK_RELEASE_KEYSTORE="$keystore"
          ./gradlew :app:assembleRelease --stacktrace
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          mkdir -p review-artifact
          cp "$apk" review-artifact/PesaTrack-Review.apk
          printf '%s\n' c278f57a9bad7690ae7b622c8aa0ad1b1f719d59 > review-artifact/SOURCE_SHA.txt
          sha256sum review-artifact/PesaTrack-Review.apk > review-artifact/APK_SHA256.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs review-artifact/PesaTrack-Review.apk > review-artifact/SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging review-artifact/PesaTrack-Review.apk > review-artifact/PACKAGE.txt
      - name: Upload test artifact privately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pesatrack-statement-review-c278f57a
          path: review-artifact/
          retention-days: 1
  candidate_full_android:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/statement-signing-review-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c278f57a9bad7690ae7b622c8aa0ad1b1f719d59
      - name: Check candidate identity
        run: test "$(git rev-parse HEAD)" = c278f57a9bad7690ae7b622c8aa0ad1b1f719d59
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: wrapper
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run all Android tests against the exact candidate
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            adb logcat -d -v raw 'PesaTrackMeasurement:I' '*:S' > history-measurements.jsonl
            echo c278f57a9bad7690ae7b622c8aa0ad1b1f719d59 > ANDROID_TEST_SOURCE_SHA.txt
      - name: Retain Android test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: statement-candidate-full-android-results
          retention-days: 3
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            history-measurements.jsonl
            ANDROID_TEST_SOURCE_SHA.txt
