name: Signed Android Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/release-build.yml'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/wrapper/**'
  workflow_dispatch:
    inputs:
      run_instrumentation:
        description: "Run Android emulator validation only when explicitly requested"
        type: boolean
        default: false
      version_name:
        description: "Release version name, for example 0.2.0"
        required: true
        type: string
      version_code:
        description: "Monotonically increasing Android version code"
        required: true
        type: string

concurrency:
  group: signed-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate_build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.13 for offline PDF extraction
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "wrapper"

      - name: Validate entity enrichment Worker
        run: |
          node --check worker/entity-enrichment/src/index.js
          node worker/entity-enrichment/test.mjs
          node worker/entity-enrichment/resource-test.mjs
          npx --yes wrangler@4.148.0 deploy --config wrangler.jsonc --dry-run --outdir /tmp/pesatrack-worker-dry-run

      - name: Generate invented financial message variants
        run: |
          python3 -m tools.python_lab.synthetic_corpus
          python3 -m tools.python_lab.financial_contracts generate

      - name: Unit tests, lint and debug APK
        env:
          PESATRACK_SYNTHETIC_CORPUS_REQUIRED: "1"
          PESATRACK_ENTITY_ENRICHMENT_URL: https://pesatrack.jameswaweru399.workers.dev/v1/entity/resolve
        shell: bash
        run: |
          set -o pipefail
          export PESATRACK_LAB_SOURCE_SHA="$(git rev-parse HEAD)"
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace 2>&1 | tee /tmp/pesatrack-build.log

      - name: Summarize Kotlin regression evidence
        shell: bash
        run: |
          export PESATRACK_LAB_SOURCE_SHA="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          reports = list(pathlib.Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          assert reports, "JVM test reports are required"
          suites = [ET.parse(path).getroot() for path in reports]
          totals = {key: sum(int(suite.attrib.get(key, 0)) for suite in suites) for key in ("tests", "failures", "errors", "skipped")}
          assert totals["failures"] == totals["errors"] == 0
          required = {"OfflineMoneyPolicyTest", "GoalSavingHistoryPolicyTest", "FinancialWhitespaceTest", "SyntheticFinancialCorpusTest", "FinancialContractLabTest"}
          verified = set()
          for suite in suites:
              name = suite.attrib["name"].split(".")[-1]
              if name in required:
                  assert int(suite.attrib["tests"]) > 0 and int(suite.attrib.get("skipped", 0)) == 0, name
                  verified.add(name)
          assert verified == required, "All new Kotlin contracts must execute"
          evidence = {"source_sha": os.environ["PESATRACK_LAB_SOURCE_SHA"], "jvm": totals, "required_suites": sorted(verified), "synthetic_variants": 2432}
          pathlib.Path("app/build/python-lab/unit-evidence.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, indent=2))
          PY

      - name: Print lint report on failure
        if: failure()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            cat "$report"
          fi

      - name: Prepare offline PDF contract test dependencies
        run: python3 -m pip install --disable-pip-version-check "pdfplumber==0.11.9" "reportlab==4.4.9"

      - name: Python lab contract tests
        run: PYTHONPATH="$PWD/app/src/main/python:$PWD" python3 -m unittest discover -s tools/python_lab -p 'test_*.py' -v

      - name: Evaluate reviewed fixtures against actual Kotlin outputs
        env:
          PESATRACK_ENTITY_ENRICHMENT_URL: https://pesatrack.jameswaweru399.workers.dev/v1/entity/resolve
        shell: bash
        run: |
          set -euo pipefail
          export PESATRACK_LAB_SOURCE_SHA="$(git rev-parse HEAD)"
          export PESATRACK_PYTHON_LAB_EXPORT=1
          rm -f app/build/python-lab/kotlin-output.json
          ./gradlew :app:testDebugUnitTest --tests '*PythonFinancialLabExportTest' --tests '*FinancialContractLabTest' --rerun-tasks --stacktrace
          python3 -m tools.python_lab.kotlin_evaluation > app/build/python-lab/evaluation.json
          cat app/build/python-lab/evaluation.json

      - name: Evaluate four invented financial contract groups
        if: success() || failure()
        shell: bash
        run: |
          export PESATRACK_LAB_SOURCE_SHA="$(git rev-parse HEAD)"
          if [ -f app/build/python-lab/financial-contract-output.json ]; then
            python3 -m tools.python_lab.financial_contracts evaluate
          else
            echo "Kotlin contract output unavailable; preceding build did not complete the contract suite."
            exit 1
          fi

      - name: Upload sanitized Python lab evaluation evidence
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-kotlin-sanitized-evaluation
          path: app/build/python-lab/*.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload debug APK for gated publication
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pesatrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3


  validate_android:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_instrumentation }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.13 for offline PDF extraction
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "wrapper"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            adb logcat -d -v raw 'PesaTrackMeasurement:I' '*:S' > history-measurements.jsonl
            echo "${{ github.sha }}" > ANDROID_TEST_SOURCE_SHA.txt

      - name: Retain invented Android test and timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-preflight-android-results
          retention-days: 14
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            history-measurements.jsonl
            ANDROID_TEST_SOURCE_SHA.txt

  release:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.validate_build.result == 'success' && (needs.validate_android.result == 'success' || needs.validate_android.result == 'skipped') }}
    needs: [validate_build, validate_android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PESATRACK_VERSION_NAME: ${{ inputs.version_name }}
      PESATRACK_VERSION_CODE: ${{ inputs.version_code }}
      PESATRACK_ENTITY_ENRICHMENT_URL: https://pesatrack.jameswaweru399.workers.dev/v1/entity/resolve
      PESATRACK_RELEASE_KEYSTORE_BASE64: ${{ secrets.PESATRACK_RELEASE_KEYSTORE_BASE64 }}
      PESATRACK_RELEASE_STORE_PASSWORD: ${{ secrets.PESATRACK_RELEASE_STORE_PASSWORD }}
      PESATRACK_RELEASE_KEY_ALIAS: ${{ secrets.PESATRACK_RELEASE_KEY_ALIAS }}
      PESATRACK_RELEASE_KEY_PASSWORD: ${{ secrets.PESATRACK_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.13 for offline PDF extraction
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "wrapper"

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${PESATRACK_VERSION_CODE}" =~ ^[1-9][0-9]*$ ]]; then
            echo "version_code must be a positive integer."
            exit 1
          fi

          if [[ ! "${PESATRACK_VERSION_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "version_name must look like 0.2.0 or 0.2.0-rc.1."
            exit 1
          fi

          for name in             PESATRACK_RELEASE_KEYSTORE_BASE64             PESATRACK_RELEASE_STORE_PASSWORD             PESATRACK_RELEASE_KEY_ALIAS             PESATRACK_RELEASE_KEY_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing required repository secret: ${name}"
              exit 1
            fi
          done

      - name: Materialize release keystore
        shell: bash
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/pesatrack-release.jks"
          printf '%s' "${PESATRACK_RELEASE_KEYSTORE_BASE64}"             | base64 --decode > "${keystore}"

          if [[ ! -s "${keystore}" ]]; then
            echo "Decoded release keystore is empty."
            exit 1
          fi

          chmod 600 "${keystore}"
          echo "PESATRACK_RELEASE_KEYSTORE=${keystore}" >> "${GITHUB_ENV}"

      - name: Validate Worker contract
        run: |
          node --check worker/entity-enrichment/src/index.js
          node worker/entity-enrichment/test.mjs
          node worker/entity-enrichment/resource-test.mjs
          npx --yes wrangler@4.148.0 deploy --config wrangler.jsonc --dry-run --outdir /tmp/pesatrack-worker-dry-run

      - name: Generate required invented financial inputs
        run: |
          python3 -m tools.python_lab.synthetic_corpus
          python3 -m tools.python_lab.financial_contracts generate

      - name: Test, lint and build signed release
        env:
          PESATRACK_SYNTHETIC_CORPUS_REQUIRED: "1"
          PESATRACK_LAB_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew             :app:testDebugUnitTest             :app:lintRelease             :app:bundleRelease             :app:assembleRelease             --stacktrace

      - name: Verify signatures and package artifacts
        shell: bash
        run: |
          set -euo pipefail

          aab="app/build/outputs/bundle/release/app-release.aab"
          apk="app/build/outputs/apk/release/app-release.apk"

          test -s "${aab}"
          test -s "${apk}"

          jarsigner -verify -strict "${aab}"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "${apk}"

          mkdir -p dist
          git rev-parse HEAD > dist/SOURCE_SHA.txt
          cp "${aab}" "dist/PesaTrack-${PESATRACK_VERSION_NAME}.aab"
          cp "${apk}" "dist/PesaTrack-${PESATRACK_VERSION_NAME}.apk"
          (
            cd dist
            sha256sum ./* > SHA256SUMS.txt
          )

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pesatrack-release-${{ inputs.version_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
