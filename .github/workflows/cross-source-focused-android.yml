name: Cross-source focused Android persistence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - '.github/workflows/cross-source-focused-android.yml'

permissions:
  contents: read

jobs:
  focused-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout exact pull request candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13 for offline PDF support
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install SDK for the test candidate
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: wrapper

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute invented-data matching, migration and backup tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.kedevjimmy.pesatrack.data.local.ActivityMirrorSafetyIntegrationTest,com.kedevjimmy.pesatrack.data.local.FingerprintConflictStoreTest,com.kedevjimmy.pesatrack.security.FingerprintConflictBackupTest,com.kedevjimmy.pesatrack.security.StatementArchiveBackupIntegrationTest,com.kedevjimmy.pesatrack.data.local.StatementMatchDecisionStoreTest

      - name: Retain Android test results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-source-focused-results
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
