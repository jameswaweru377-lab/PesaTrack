name: Development Tracker (Read-only)

on:
  issues:
    types: [opened, reopened, edited, labeled, unlabeled, closed]
  pull_request:
    types: [opened, reopened, synchronize, edited, closed]
  push:
    branches: [main]
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      preview_project:
        description: Preview configured Project status changes without writing
        required: false
        type: boolean
        default: false
      preview_owner:
        description: Preview canonical Issue chat owners in the existing Project text field
        required: false
        type: boolean
        default: false
      preview_pr_inbox:
        description: Preview open-PR cards missing from the existing Project without writing
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: development-tracker-${{ github.repository }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout trusted main tracker code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Generate an advisory status summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f tools/tracker/cli.py ]; then
            python3 -m tools.tracker.cli --repository "$GITHUB_REPOSITORY" --dry-run
          else
            echo "Tracker not installed on main yet; initial PR advisory run skipped safely."
          fi
      - name: Preview approved Project Chat owner text changes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_owner == true }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PESATRACK_TRACKER_PROJECTS_TOKEN: ${{ secrets.PESATRACK_TRACKER_PROJECTS_TOKEN }}
          PESATRACK_TRACKER_PROJECT_ID: ${{ vars.PESATRACK_TRACKER_PROJECT_ID }}
        run: python3 -m tools.tracker.project_sync --repository "$GITHUB_REPOSITORY" --preview-owner
      - name: Preview approved Project tracker-field updates
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_project == true && vars.PESATRACK_TRACKER_PROJECT_SYNC_ENABLED != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PESATRACK_TRACKER_PROJECTS_TOKEN: ${{ secrets.PESATRACK_TRACKER_PROJECTS_TOKEN }}
          PESATRACK_TRACKER_PROJECT_ID: ${{ vars.PESATRACK_TRACKER_PROJECT_ID }}
        run: python3 -m tools.tracker.project_sync --repository "$GITHUB_REPOSITORY"
      - name: Mirror canonical Issues to the approved Project tracker field
        # Fork and Dependabot PRs have no Actions Project secret, even when
        # Dependabot's head branch belongs to this repository. Keep their
        # advisory summaries, but never attempt privileged Project writes.
        if: ${{ vars.PESATRACK_TRACKER_PROJECT_SYNC_ENABLED == 'true' && github.actor != 'dependabot[bot]' && (github.event_name != 'workflow_dispatch' || (inputs.preview_owner != true && inputs.preview_pr_inbox != true)) && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PESATRACK_TRACKER_PROJECTS_TOKEN: ${{ secrets.PESATRACK_TRACKER_PROJECTS_TOKEN }}
          PESATRACK_TRACKER_PROJECT_ID: ${{ vars.PESATRACK_TRACKER_PROJECT_ID }}
          PESATRACK_TRACKER_PROJECT_SYNC_ENABLED: ${{ vars.PESATRACK_TRACKER_PROJECT_SYNC_ENABLED }}
          PESATRACK_TRACKER_OWNER_SYNC_ENABLED: ${{ vars.PESATRACK_TRACKER_OWNER_SYNC_ENABLED }}
        run: python3 -m tools.tracker.project_sync --repository "$GITHUB_REPOSITORY" --apply
      - name: Preview open-PR intake into existing Project
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_pr_inbox == true }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PESATRACK_TRACKER_PROJECTS_TOKEN: ${{ secrets.PESATRACK_TRACKER_PROJECTS_TOKEN }}
          PESATRACK_TRACKER_PROJECT_ID: ${{ vars.PESATRACK_TRACKER_PROJECT_ID }}
        run: |
          if [ -f tools/tracker/pr_inbox.py ]; then
            python3 -m tools.tracker.pr_inbox --repository "$GITHUB_REPOSITORY"
          else
            echo "PR intake not yet installed on trusted main; preview skipped."
          fi
      - name: Discover open PRs as separate Project intake cards
        # Reuse the already enabled Project credential; never expose it to fork or Dependabot PRs.
        if: ${{ vars.PESATRACK_TRACKER_PROJECT_SYNC_ENABLED == 'true' && github.actor != 'dependabot[bot]' && (github.event_name != 'workflow_dispatch' || (inputs.preview_owner != true && inputs.preview_pr_inbox != true)) && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PESATRACK_TRACKER_PROJECTS_TOKEN: ${{ secrets.PESATRACK_TRACKER_PROJECTS_TOKEN }}
          PESATRACK_TRACKER_PROJECT_ID: ${{ vars.PESATRACK_TRACKER_PROJECT_ID }}
          PESATRACK_TRACKER_PROJECT_SYNC_ENABLED: ${{ vars.PESATRACK_TRACKER_PROJECT_SYNC_ENABLED }}
        run: |
          if [ -f tools/tracker/pr_inbox.py ]; then
            python3 -m tools.tracker.pr_inbox --repository "$GITHUB_REPOSITORY" --apply
          else
            echo "PR intake not yet installed on trusted main; application skipped."
          fi
