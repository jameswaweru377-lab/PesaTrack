name: Development Tracker (Read-only)

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, closed]
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: development-tracker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout trusted main tracker code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Generate an advisory status summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f tools/tracker/cli.py ]; then
            python3 -m tools.tracker.cli --repository "$GITHUB_REPOSITORY" --dry-run
          else
            echo "Tracker not installed on main yet; initial PR advisory run skipped safely."
          fi
