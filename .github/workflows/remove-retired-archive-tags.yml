name: Owner-approved archive tag cleanup

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: merged-branch-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  remove-archives:
    name: Preserve ci-apk and remove exactly 105 archive tags
    if: >-
      github.event.issue.number == 528 &&
      github.actor == 'jameswaweru377-lab' &&
      github.event.comment.user.login == 'jameswaweru377-lab' &&
      github.event.comment.body == '/pesatrack-delete-all-archive-tags-105'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Confirm only approved old archive tags are selected
        run: python3 -m tools.tracker.remove_archive_tags
      - name: Atomically delete 105 old archive tags, preserving ci-apk
        run: python3 -m tools.tracker.remove_archive_tags --apply
