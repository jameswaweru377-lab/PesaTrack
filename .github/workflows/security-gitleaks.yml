name: Security - PR Secrets

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: security-gitleaks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout PR history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The Gitleaks Action v3 queries only the first page of PR commits.
      # Use the pinned CLI on the explicit base..head range for complete coverage.
      - name: Scan the complete PR commit range with Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            --pattern 'gitleaks_8.30.1_linux_x64.tar.gz' --dir "$RUNNER_TEMP"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" \
            | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 \
            --log-opts="$BASE_SHA..$HEAD_SHA" --timeout=300 .
